name: Refresh work treemap

# Regenerates the repository treemap from the GitHub API and commits it only
# when the rendered SVG actually differs, so the history stays meaningful
# instead of one empty commit per day.

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/treemap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treemap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate treemap
        env:
          # A PAT with `repo` scope (secret REPOS_TOKEN) lets the treemap
          # include private repositories as unlabelled shape. Without it this
          # falls back to the built-in token, which sees only public repos.
          GITHUB_TOKEN: ${{ secrets.REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/generate-treemap.mjs

      - name: Verify no private names leaked
        env:
          GITHUB_TOKEN: ${{ secrets.REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/check-no-private-names.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "Treemap unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh work treemap"
          git push
